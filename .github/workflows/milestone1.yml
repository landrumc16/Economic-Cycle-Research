name: Milestone 1 - Economic Data Acquisition and QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
  workflow_run:
    workflows: ['Monthly Economic Cycle Assessment']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: milestone1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Python modules
        run: python -m compileall -q scripts tests
      - name: Verify parser and comparison tests
        run: python -m unittest discover -s tests -v
      - name: Attempt official BLS public API fallback
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: timeout 240s python -u scripts/bls_api.py --output audit-output/bls-api
      - name: Attempt official FRED API fallback
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            timeout 240s python -u scripts/fred_api.py --output audit-output/fred-api
          else
            echo 'FRED_API_KEY not configured; FRED API fallback skipped (still blocked).'
          fi
      - name: Acquire BEA official GDP data
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          if [ -n "$BEA_API_KEY" ]; then
            timeout 100s python -u scripts/bea_api.py --output audit-output/bea-api
          else
            echo 'BEA_API_KEY not configured; BEA acquisition skipped (still blocked).'
          fi
      - name: Reconcile BEA and FRED GDP
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python -u scripts/gdp_api_crosscheck.py
      - name: Reconcile BLS API and FRED API observations
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python -u scripts/api_crosscheck.py --bls audit-output/bls-api --fred audit-output/fred-api
      - name: Build retrospective event panel (non-PIT exploratory)
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python -u scripts/retrospective_event_panel.py --input audit-output/fred-api --output audit-output/phase2
      - name: Compare historical crash economic trajectories (retrospective)
        continue-on-error: true
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: python -u scripts/compare_crash_events.py --input audit-output/fred-api --output audit-output/phase2
      - name: Generate fail-closed operational model status
        if: always()
        run: |
          mkdir -p audit-output
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = Path("audit-output/milestone1_gate.json")
          if not evidence.exists():
              evidence.write_text(json.dumps({"series": {}, "all_evidence_pass": False}, indent=2) + "\n")
          PY
          python -u scripts/operational_model_status.py --gate audit-output/milestone1_gate.json --output audit-output/operational_model_status.json
      - name: Build source-qualified economic observation readout
        if: always()
        run: python -u scripts/economic_observation_readout.py --input audit-output/fred-api --gate audit-output/milestone1_gate.json --output audit-output/economic_observation_readout.json
      - name: Calculate descriptive macro transformations (research only)
        if: always()
        run: python -u scripts/descriptive_macro_metrics.py --input audit-output/fred-api --output audit-output/descriptive_macro_metrics.json
      - name: Explain macro directions across growth labor and inflation
        if: always()
        run: python -u scripts/cycle_research_readout.py --metrics audit-output/descriptive_macro_metrics.json --output audit-output/cycle_research_readout.json
      - name: Compare current macro conditions with five historical pathways (exploratory)
        if: always()
        run: python -u scripts/historical_macro_analogues.py --fred audit-output/fred-api --metrics audit-output/descriptive_macro_metrics.json --output audit-output/historical_macro_analogues.json
      - name: Stage workbook financial and housing research snapshot
        if: always()
        run: python -u scripts/financial_housing_overlay.py --input data/workbook_current_risk_snapshot_2026-10-30.json --as-of 2026-10-30 --output audit-output/financial_housing_overlay.json
      - name: Combine provenance-aware research domains (non-predictive)
        if: always()
        run: python -u scripts/integrated_research_readout.py --macro audit-output/cycle_research_readout.json --financial audit-output/financial_housing_overlay.json --output audit-output/integrated_research_readout.json
      - name: Assess current economic conditions across crash mechanisms (descriptive only)
        if: always()
        run: python -u scripts/current_cycle_assessment.py --input audit-output/integrated_research_readout.json --output audit-output/current_cycle_assessment.json
      - name: Attach canonical historical pathways and noncrash controls
        if: always()
        run: python -u scripts/historical_research_bridge.py --input audit-output/integrated_research_readout.json --output audit-output/integrated_research_readout.json
      - name: Read canonical historical observations (dated snapshot, non-PIT)
        if: always()
        run: python -u scripts/workbook_historical_observations.py --input data/workbook_historical_research_snapshot_2026-10-30.json --output audit-output/historical_workbook_observations.json --require-complete
      - name: Validate publisher-original vintage evidence contract (not PIT certification)
        if: always()
        run: python -u scripts/validate_publisher_vintage_manifest.py --input config/publisher_original_vintage_manifest.json --output audit-output/publisher_vintage_contract.json
      - name: Validate original publisher release staging and no-lookahead timestamps
        if: always()
        run: python -u scripts/validate_release_evidence.py --input data/publisher_original_release_records.json --output audit-output/publisher_release_evidence.json
      - name: Record per-series macro refresh status
        if: always()
        run: python -u scripts/source_refresh_manifest.py --input audit-output/fred-api --as-of "$(date -u +%F)" --output audit-output/dashboard/source_refresh_manifest.json
      - name: Retrieve prior weekly snapshot when available
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, zipfile, io
          from datetime import date
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15)
          url = "https://api.github.com/repos/" + repo + "/actions/workflows/milestone1.yml/runs?status=success&per_page=30"
          runs = json.load(get(url)).get("workflow_runs", [])
          cutoff = date.today()
          for run in runs:
              if run["id"] == int(os.environ["GITHUB_RUN_ID"]):
                  continue
              artifacts = json.load(get(run["artifacts_url"])).get("artifacts", [])
              for artifact in artifacts:
                  if artifact["name"] != "milestone1-audit-evidence" or artifact.get("expired"):
                      continue
                  try:
                      blob = get(artifact["archive_download_url"]).read()
                      with zipfile.ZipFile(io.BytesIO(blob)) as archive:
                          matches = [n for n in archive.namelist() if n.endswith("v3_weekly_snapshot.json")]
                          if not matches:
                              continue
                          previous = json.loads(archive.read(matches[0]))
                      if date.fromisoformat(previous["as_of"]) >= cutoff:
                          continue
                      target = Path("audit-output/v3_previous_weekly_snapshot.json")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(json.dumps(previous, indent=2) + chr(10))
                      json.loads(target.read_text())
                      print("Recovered prior dated snapshot:", previous["as_of"], "run", run["id"])
                      raise SystemExit(0)
                  except (OSError, ValueError, KeyError, zipfile.BadZipFile) as exc:
                      print("Skipping unusable prior artifact:", exc)
          print("No earlier dated weekly snapshot available; first-run comparison stays unavailable.")
          PY
      - name: Build Version 3 weekly source-evidence snapshot
        if: always()
        run: python -u scripts/v3_weekly_snapshot.py --refresh audit-output/dashboard/source_refresh_manifest.json --as-of "$(date -u +%F)" --previous audit-output/v3_previous_weekly_snapshot.json --output audit-output/v3_weekly_snapshot.json
      - name: Audit Version 4 weekly data and comparison readiness
        run: python -u scripts/v4_data_readiness.py --snapshot audit-output/v3_weekly_snapshot.json --output audit-output/v4_data_readiness.json
      - name: Audit Version 5 temporal provenance and release-aware comparisons
        run: python -u scripts/v5_temporal_provenance.py --snapshot audit-output/v3_weekly_snapshot.json --output audit-output/v5_temporal_provenance.json
      - name: Assemble Version 5 dated FRED observation history
        run: python -u scripts/v5_dated_history.py --fred audit-output/fred-api --as-of "$(date -u +%F)" --output audit-output/v5_dated_history.json
      - name: Build Version 5 standardized macro measures from available dated history
        run: python -u scripts/v5_standardized_macro.py --history audit-output/v5_dated_history.json --output audit-output/v5_standardized_macro_metrics.json
      - name: Build Version 4 explainable economic-cycle signal evidence
        run: python -u scripts/v4_economic_signals.py --snapshot audit-output/v3_weekly_snapshot.json --output audit-output/v4_economic_signals.json
      - name: Build Version 4 distinct downturn mechanism evidence
        run: python -u scripts/v4_mechanism_assessment.py --signals audit-output/v4_economic_signals.json --output audit-output/v4_mechanism_assessment.json
      - name: Build Version 2 canonical historical comparison
        if: always()
        run: python -u scripts/v2_canonical_comparison.py --snapshot data/workbook_historical_research_snapshot_2026-10-30.json --output audit-output/v2_canonical_comparison.json
      - name: Build Version 2 pathway coverage matrix
        if: always()
        run: python -u scripts/v2_pathway_coverage.py --comparison audit-output/v2_canonical_comparison.json --output audit-output/v2_pathway_coverage.json
      - name: Join canonical crash lead-window summary
        if: always()
        run: python -u scripts/v2_lead_window_summary.py --profiles audit-output/v2_pathway_coverage.json --source data/v2_canonical_lead_window_summary_2026-10-31.json --output audit-output/v2_lead_window_summary.json
      - name: Build Version 2 global transmission evidence inventory
        if: always()
        run: python -u scripts/v2_global_transmission.py --profiles audit-output/v2_pathway_coverage.json --output audit-output/v2_global_transmission.json
      - name: Audit Version 3 historical cohorts and negative-control gaps
        if: always()
        run: python -u scripts/v3_historical_cohort_audit.py --comparison audit-output/v2_canonical_comparison.json --output audit-output/v3_historical_cohort_audit.json
      - name: Build Version 4 historical episode registry
        run: python -u scripts/v4_historical_episode_registry.py --cohort audit-output/v3_historical_cohort_audit.json --output audit-output/v4_historical_episode_registry.json
      - name: Build Version 5 historical episode and negative-control research artifact
        run: python -u scripts/v5_historical_episode_research.py --episodes audit-output/v4_historical_episode_registry.json --as-of "$(date -u +%F)" --output audit-output/v5_historical_episode_research.json
      - name: Audit Version 5 objective historical outcome evidence coverage
        run: python -u scripts/v5_objective_outcomes.py --as-of "$(date -u +%F)" --output audit-output/v5_objective_outcomes.json
      - name: Audit Version 5 publisher-original historical replay coverage
        run: python -u scripts/v5_pit_replay.py --as-of "$(date -u +%F)" --output audit-output/v5_pit_replay.json
      - name: Audit Version 5 mechanism-specific research readiness
        run: python -u scripts/v5_mechanism_evidence.py --standardized audit-output/v5_standardized_macro_metrics.json --output audit-output/v5_mechanism_evidence_gate.json
      - name: Assemble Version 5 weekly integrated research readout
        run: python -u scripts/v5_weekly_research_readout.py --standardized audit-output/v5_standardized_macro_metrics.json --mechanisms audit-output/v5_mechanism_evidence_gate.json --outcomes audit-output/v5_objective_outcomes.json --replay audit-output/v5_pit_replay.json --output audit-output/v5_weekly_research_readout.json
      - name: Build Version 5 offline weekly dashboard
        run: python -u scripts/v5_weekly_dashboard.py --readout audit-output/v5_weekly_research_readout.json --output audit-output/dashboard/weekly-v5.html
      - name: Verify Version 5 descriptive weekly release
        run: python -u scripts/v5_release_acceptance.py --directory audit-output --output audit-output/v5_release_acceptance.json
      - name: Verify Version 5 descriptive artifact manifest
        if: always()
        run: python -u scripts/v5_release_evidence_manifest.py --directory audit-output --output audit-output/v5_release_evidence_manifest.json
      - name: Produce Version 3 weekly assessment with historical evidence coverage
        if: always()
        run: python -u scripts/v3_weekly_assessment.py --snapshot audit-output/v3_weekly_snapshot.json --historical audit-output/v2_pathway_coverage.json --json-output audit-output/v3_weekly_assessment.json --markdown-output audit-output/v3_weekly_assessment.md
      - name: Build Version 3 weekly dashboard
        if: always()
        run: python -u scripts/v3_weekly_dashboard.py --assessment audit-output/v3_weekly_assessment.json --output audit-output/dashboard/weekly.html
      - name: Build Version 4 global and social evidence register
        run: python -u scripts/v4_global_social_register.py --output audit-output/v4_global_social_register.json
      - name: Evaluate Version 4 predictive validation gate
        run: python -u scripts/v4_predictive_validation_gate.py --episodes audit-output/v4_historical_episode_registry.json --output audit-output/v4_predictive_validation_gate.json
      - name: Build Version 4 integrated weekly dashboard
        run: python -u scripts/v4_weekly_dashboard.py --output audit-output/dashboard/weekly-v4.html
      - name: Verify Version 4 integrated descriptive release
        run: python -u scripts/v4_release_acceptance.py --directory audit-output --output audit-output/v4_release_acceptance.json
      - name: Verify Version 3 descriptive weekly release
        run: python -u scripts/v3_release_acceptance.py --assessment audit-output/v3_weekly_assessment.json --dashboard audit-output/dashboard/weekly.html --output audit-output/v3_release_acceptance.json
      - name: Build usable research dashboard from existing workbook snapshots
        if: always()
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_run" ] || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; }; then
            EXTRA_FLAGS="--require-macro-values"
          fi
          python -u scripts/build_dashboard.py --macro audit-output/cycle_research_readout.json --strict-macro $EXTRA_FLAGS --cycle-assessment audit-output/current_cycle_assessment.json --historical-analogues audit-output/historical_macro_analogues.json --v2-comparison audit-output/v2_canonical_comparison.json --v2-trajectories audit-output/v2_pathway_coverage.json --v2-lead-windows audit-output/v2_lead_window_summary.json --v2-global audit-output/v2_global_transmission.json --refresh-manifest audit-output/dashboard/source_refresh_manifest.json --output audit-output/dashboard/index.html --json-output audit-output/dashboard/state.json
      - name: Evaluate Version 1 research dashboard acceptance
        if: always()
        run: python -u scripts/v1_acceptance.py --html audit-output/dashboard/index.html --state audit-output/dashboard/state.json --output audit-output/dashboard/v1_acceptance.json
      - name: Evaluate Version 2 milestone 1 acceptance
        if: always()
        run: python -u scripts/v2_m1_acceptance.py --comparison audit-output/v2_canonical_comparison.json --html audit-output/dashboard/index.html --state audit-output/dashboard/state.json --output audit-output/v2_m1_acceptance.json
      - name: Evaluate final Version 2 descriptive release acceptance
        if: always()
        run: python -u scripts/v2_release_acceptance.py --v2 audit-output/v2_m1_acceptance.json --v1 audit-output/dashboard/v1_acceptance.json --state audit-output/dashboard/state.json --html audit-output/dashboard/index.html --output audit-output/v2_release_acceptance.json
      - name: Summarize Version 3 weekly release readiness
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## Version 3 weekly economic intelligence")
          for name in ("v3_release_acceptance", "v3_weekly_snapshot", "v3_weekly_assessment"):
              p = Path("audit-output") / (name + ".json")
              if not p.exists():
                  print("- " + name + ": MISSING")
                  continue
              obj = json.loads(p.read_text())
              print("- " + name + ": " + str(obj.get("status", "GENERATED")))
              if name == "v3_weekly_snapshot":
                  coverage = obj.get("source_coverage", {})
                  print("  - Sources staged: " + str(coverage.get("available", 0)) + " / " + str(coverage.get("defined", 0)))
              if name == "v3_release_acceptance":
                  print("  - Predictive release: " + str(obj.get("predictive_release", "BLOCKED")))
          print("")
          print("Open dashboard/weekly.html from milestone1-audit-evidence. Passing CI does not certify live-source freshness.")
          PY
      - name: Publish static dashboard to job summary
        if: always()
        run: |
          {
            echo '## Economic Cycle Research dashboard'
            echo ''
            echo 'The HTML dashboard, state.json, and v1_acceptance.json are in the milestone1-audit-evidence artifact under dashboard/.'
            echo ''
            echo '### Version 1 acceptance'
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("audit-output/dashboard/v1_acceptance.json")
          if not p.exists():
              print("**INCOMPLETE** — acceptance report missing.")
          else:
              report = json.loads(p.read_text())
              print("**" + report.get("status", "INCOMPLETE") + "**")
              print("Predictive model: " + report.get("predictive_model_status", "NOT_VALIDATED"))
              for issue in report.get("issues", []):
                  print("- " + issue)
          PY
            echo ''
            echo 'This is a dated descriptive research snapshot, not a live forecast or investment recommendation.'
            echo ''
            echo 'Source: SEM_Historical_Crash_Research_v1; no predictive approval.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize Version 5 descriptive release readiness
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## Version 5 weekly economic research")
          path = Path("audit-output/v5_release_acceptance.json")
          if not path.exists():
              print("- Descriptive release: INCOMPLETE (acceptance artifact missing)")
          else:
              result = json.loads(path.read_text())
              print("- Descriptive release: " + result.get("status", "UNKNOWN"))
              for issue in result.get("issues", []):
                  print("- Issue: " + issue)
          manifest = Path("audit-output/v5_release_evidence_manifest.json")
          if manifest.exists():
              evidence = json.loads(manifest.read_text())
              print("- Artifact manifest: " + evidence.get("status", "UNKNOWN"))
              print("- Macro availability: " + str(evidence.get("macro_available", 0)) + " / " + str(evidence.get("macro_total", 0)))
          else:
              print("- Artifact manifest: MISSING")
          print("- Predictive publication: BLOCKED pending independent validation")
          print("- Dashboard: dashboard/weekly-v5.html in milestone1-audit-evidence")
          PY
      - name: Verify dashboard is eligible for public publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("audit-output")
          acceptance = json.loads((root / "v5_release_acceptance.json").read_text())
          manifest = json.loads((root / "v5_release_evidence_manifest.json").read_text())
          assert acceptance.get("status") == "PASS_DESCRIPTIVE_ONLY" and not acceptance.get("issues"), "V5 descriptive gate failed"
          assert manifest.get("status") == "DESCRIPTIVE_ARTIFACTS_VERIFIED" and not manifest.get("issues"), "V5 evidence manifest failed"
          dashboard = root / "dashboard"
          for name in ("index.html", "weekly-v5.html", "state.json"):
              assert (dashboard / name).is_file(), f"Missing dashboard/{name}"
          (dashboard / "release-evidence.json").write_text(json.dumps({
              "source_run": "${{ github.run_id }}",
              "descriptive_release": acceptance["status"],
              "manifest": manifest["status"],
              "predictive_release": "BLOCKED"
          }, indent=2) + "\n")
          PY
      - name: Include latest accepted monthly assessment in public dashboard
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The monthly workflow owns research generation. Reuse its latest
          # successful archived artifact instead of rerunning its research.
          mkdir -p audit-output/dashboard
          # Search recent successful workflow artifacts: a green job can still
          # contain a STALE_RESEARCH_ONLY monthly gate.
          mkdir -p /tmp/economic-monthly
          for run_id in $(gh run list --workflow industry-deviation-descriptive.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId' || true); do
            rm -rf /tmp/economic-monthly/*
            if ! gh run download "$run_id" --name industry-deviation-descriptive-evidence --dir /tmp/economic-monthly; then
              continue
            fi
            if python - <<'CHECK'
          import json
          from pathlib import Path
          files = list(Path("/tmp/economic-monthly").rglob("weekly_release_acceptance.json"))
          if len(files) != 1:
              raise SystemExit(1)
          root = files[0].parent
          gate = json.loads(files[0].read_text())
          dashboard = root / "economic_dashboard.json"
          html = root / "economic_dashboard.html"
          if not dashboard.is_file() or not html.is_file():
              raise SystemExit(1)
          report = json.loads(dashboard.read_text())
          status = gate.get("status")
          if status not in ("PASS", "STALE_RESEARCH_ONLY"):
              raise SystemExit(1)
          if status == "PASS" and (report.get("stale") is not False
                                   or gate.get("assessment_date") != report.get("assessment_date")):
              raise SystemExit(1)
          if status == "STALE_RESEARCH_ONLY":
              overview = root / "overview.html"
              if not overview.is_file() or "Historical research only" not in overview.read_text():
                  raise SystemExit(1)
          CHECK
            then
              echo "Recovered monthly research artifact (current-qualified or explicitly stale) from run $run_id" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            rm -rf /tmp/economic-monthly/*
          done
          python - <<'PY'
          import json
          from pathlib import Path
          extracted = Path("/tmp/economic-monthly")
          matches = list(extracted.rglob("weekly_release_acceptance.json"))
          root = matches[0].parent if len(matches) == 1 else extracted / "audit-output"
          dest = Path("audit-output/dashboard")
          gate = root / "weekly_release_acceptance.json"
          html = root / "economic_dashboard.html"
          report = root / "economic_dashboard.json"
          if not all(p.is_file() for p in (gate, html, report)):
              print("Monthly artifact incomplete; not publishing.")
          else:
              approval = json.loads(gate.read_text())
              assessment = json.loads(report.read_text())
              status = approval.get("status")
              # Historical/stale research is not an approved current assessment.
              if status != "PASS" or assessment.get("stale") is not False or not assessment.get("assessment_date"):
                  print(f"Monthly report not current-qualified ({status}); not publishing.")
              else:
                  dest.joinpath("monthly.html").write_bytes(html.read_bytes())
                  dest.joinpath("monthly.json").write_bytes(report.read_bytes())
                  print(f"Published accepted monthly assessment: {assessment.get('assessment_date')}")
          PY
      - name: Preserve last accepted monthly report when no replacement qualifies
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        shell: bash
        run: |
          set -euo pipefail
          if [ -f audit-output/dashboard/monthly.html ]; then
            echo 'New accepted monthly report ready for publication.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="https://${{ github.repository_owner }}.github.io/Economic-Cycle-Research"
          if curl --fail --silent --show-error --location --max-time 15 "$base/monthly.html" -o /tmp/previous-monthly.html &&
             curl --fail --silent --show-error --location --max-time 15 "$base/monthly.json" -o /tmp/previous-monthly.json &&
             python -c 'import json,sys; x=json.load(open("/tmp/previous-monthly.json")); assert x.get("assessment_date") and x.get("stale") is False'; then
            cp /tmp/previous-monthly.html audit-output/dashboard/monthly.html
            cp /tmp/previous-monthly.json audit-output/dashboard/monthly.json
            echo 'Retained last accepted monthly assessment; no qualifying replacement.' >> "$GITHUB_STEP_SUMMARY"
          else
            # A previously published report must never disappear because a refresh
            # could not retrieve it. Distinguish genuine absence from network failure.
            html_status="$(curl --silent --show-error --location --max-time 15 -o /dev/null -w '%{http_code}' "$base/monthly.html" || true)"
            json_status="$(curl --silent --show-error --location --max-time 15 -o /dev/null -w '%{http_code}' "$base/monthly.json" || true)"
            if [ "$html_status" != "404" ] || [ "$json_status" != "404" ]; then
              echo "::error::Cannot recover or verify previous monthly publication (HTML HTTP $html_status; JSON HTTP $json_status); refusing deployment."
              exit 1
            fi
            echo 'No qualifying current monthly assessment; none published. Inspect monthly workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link only published monthly assessment from dashboard
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        run: |
          python - <<'PY'
          from pathlib import Path
          dashboard = Path("audit-output/dashboard")
          index = dashboard / "index.html"
          monthly = dashboard / "monthly.html"
          if monthly.is_file():
              html = index.read_text()
              anchor = '<a href="weekly-v5.html">Latest weekly research assessment</a>'
              assert anchor in html, "Expected legacy navigation anchor missing"
              html = html.replace(anchor, '<a href="monthly.html">Latest approved monthly economic assessment</a> · <a href="weekly-v5.html">Historical weekly research archive</a>', 1)
              index.write_text(html)
          PY
      - name: Publish qualified V6 bundle or preserve last accepted V6 publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path

          source = Path("/tmp/economic-monthly")
          target = Path("audit-output/dashboard")
          names = ("overview.html", "historical.html", "sectors.html", "monthly-research.html",
                   "research.html", "v6_sector_report.json", "v5_dashboard.html",
                   "economic_dashboard.html", "v5_executive_brief.md") + tuple(
              f"sector-{i:02d}.html" for i in range(1, 12))
          gates = list(source.rglob("weekly_release_acceptance.json"))
          root = gates[0].parent if len(gates) == 1 else None
          qualified = False
          if root:
              gate = json.loads(gates[0].read_text())
              qualified = gate.get("status") in ("PASS", "STALE_RESEARCH_ONLY") and all(
                  (root / name).is_file() for name in names)
              if qualified:
                  overview = (root / "overview.html").read_text()
                  if gate["status"] == "STALE_RESEARCH_ONLY" and "Historical research only" not in overview:
                      raise ValueError("Stale monthly evidence lacks mandatory public warning")
          if qualified:
              sector_report = json.loads((root / "v6_sector_report.json").read_text())
              if len(sector_report.get("sectors", [])) != 11:
                  raise ValueError("Invalid monthly V6 sector report; refusing publication")
              for name in names:
                  (target / name).write_bytes((root / name).read_bytes())
              print("Published evidence-gated V6 bundle; current gate:", gate["status"])
          else:
              # The absence of a new qualified artifact must never silently erase
              # an accepted previous V6 publication on a Pages redeployment.
              base = "https://${{ github.repository_owner }}.github.io/Economic-Cycle-Research/"
              fetched = {}
              for name in names:
                  try:
                      with urllib.request.urlopen(base + name, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError("Unexpected HTTP status for " + name)
                          fetched[name] = response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404 and name == names[0]:
                          print("No previous V6 bundle; publishing legacy dashboard only.")
                          break
                      raise RuntimeError("Incomplete previous V6 publication; refusing to erase it") from exc
                  except (urllib.error.URLError, TimeoutError) as exc:
                      raise RuntimeError("Unable to verify previous V6 publication; refusing deployment") from exc
              if fetched:
                  if len(fetched) != len(names):
                      raise RuntimeError("Incomplete recovered V6 bundle")
                  report = json.loads(fetched["v6_sector_report.json"])
                  if len(report.get("sectors", [])) != 11:
                      raise RuntimeError("Invalid previous V6 sector report")
                  for name, body in fetched.items():
                      (target / name).write_bytes(body)
                  print("Recovered all pages from previous V6 publication.")
          if (target / "overview.html").is_file():
              # The accepted V6 overview is the one public home page. Retain
              # the original V5 landing as a historical archive, not a rival home.
              index = target / "index.html"
              legacy = target / "v5_legacy_index.html"
              if not legacy.exists():
                  legacy.write_bytes(index.read_bytes())
              index.write_bytes((target / "overview.html").read_bytes())
              if index.read_bytes() != (target / "overview.html").read_bytes():
                  raise RuntimeError("V6 home page does not match accepted overview")
          PY
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package approved dashboard for GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: audit-output/dashboard
      - name: Deploy approved dashboard to GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed public dashboard and research pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          base = os.environ["PAGE_URL"].rstrip("/")
          required = ["index.html", "weekly-v5.html", "state.json", "release-evidence.json"]
          if Path("audit-output/dashboard/overview.html").exists():
              required += ["overview.html", "historical.html", "sectors.html", "monthly-research.html", "research.html", "v6_sector_report.json", "v5_dashboard.html", "economic_dashboard.html", "v5_executive_brief.md"]
              required += [f"sector-{i:02d}.html" for i in range(1, 12)]
              required += ["v5_legacy_index.html"]
          if Path("audit-output/dashboard/monthly.html").exists():
              required += ["monthly.html", "monthly.json"]
          published = {}
          for path in required:
              url = base + "/" + path
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(url, timeout=15) as response:
                          body = response.read()
                          if response.status != 200 or not body:
                              raise ValueError("empty or non-200 response")
                          if path.endswith(".html") and b'viewport' not in body:
                              raise ValueError("mobile viewport missing")
                          if path == "v6_sector_report.json":
                              import json
                              report = json.loads(body)
                              if len(report.get("sectors", [])) != 11:
                                  raise ValueError("incomplete 11-sector report")
                          if path == "overview.html":
                              for href in (b'sectors.html', b'monthly-research.html', b'research.html'):
                                  if href not in body:
                                      raise ValueError("missing V6 navigation link")
                          published[path] = body
                          print("PUBLIC VERIFIED:", url, len(body), "bytes")
                          break
                  except (OSError, ValueError) as exc:
                      if attempt == 11:
                          raise RuntimeError(f"Public deployment check failed: {url}: {exc}") from exc
                      time.sleep(10)
          if "overview.html" in published:
              if published["index.html"] != published["overview.html"]:
                  raise RuntimeError("Live homepage does not match approved V6 overview")
              if published["v5_legacy_index.html"] == published["index.html"]:
                  raise RuntimeError("Legacy V5 archive was replaced by the V6 homepage")
              print("PUBLIC VERIFIED: one V6 homepage and distinct V5 archive")
          PY
      - name: Preserve source evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-audit-evidence
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
