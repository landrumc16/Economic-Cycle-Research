name: Milestone 1 - Economic Data Acquisition and QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1'
permissions:
  contents: read
concurrency:
  group: milestone1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and comparison tests
        run: python -m unittest discover -s tests -v
      - name: Acquire and crosscheck official series
        run: timeout 360s python -u scripts/milestone1.py --output audit-output
      - name: Preserve source evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-audit-evidence
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
