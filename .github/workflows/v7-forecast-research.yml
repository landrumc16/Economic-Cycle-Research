name: V7 Forecast Research
# Research-only workflow for the V7 forecasting engine. It never publishes or
# deploys, and it does not trigger the production Milestone 1 workflow.
on:
  push:
    branches: [v7-development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-forecast-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full regression suite
        run: python -m unittest discover -s tests
      - name: Fetch V7 research series from the official FRED API
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          for series in GS10 TB3MS BAA USREC UNRATE CPIAUCSL INDPRO PAYEMS ICSA; do
            python scripts/fetch_industry_observations.py "$series" --start 1948-01-01 --end "$(date -u +%F)"
          done
      - name: Print dated data snapshot (compact, one line per series)
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("data/industry_observations")
          print("V7DATA-BEGIN")
          for series in ("GS10","TB3MS","BAA","USREC","UNRATE","CPIAUCSL","INDPRO","PAYEMS","ICSA"):
              meta = json.loads((root / f"{series}_metadata.json").read_text())
              rows = list(csv.DictReader((root / f"{series}_monthly.csv").open()))
              months = [r["date"][:7] for r in rows]
              values = {r["date"][:7]: r["value"] for r in rows}
              # Contiguous calendar months from first to last; unpublished months are blank.
              y, m = map(int, months[0].split("-")); seq = []
              while f"{y:04d}-{m:02d}" <= months[-1]:
                  seq.append(values.get(f"{y:04d}-{m:02d}", "")); m += 1
                  if m == 13: y, m = y + 1, 1
              print("V7SERIES", series, months[0], len(rows), meta.get("source_url"), ",".join(seq))
          print("V7DATA-END")
          PY
      - name: Fetch Pass B research data (French industries/factors, Damodaran, ALFRED first releases)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/v7_fetch_research_data.py --output-dir data/v7_research_fresh
      - name: Print research data as compressed, checksummed blocks (for offline reproducibility)
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          for f in sorted(Path("data/v7_research_fresh").iterdir()):
              raw = f.read_bytes()
              b = base64.b64encode(gzip.compress(raw, mtime=0)).decode()
              chunks = [b[i:i + 20000] for i in range(0, len(b), 20000)]
              print("V7FILE-BEGIN", f.name, hashlib.sha256(raw).hexdigest(), len(chunks))
              for c in chunks:
                  print("V7CHUNK", c)
              print("V7FILE-END", f.name)
          PY
      - name: V7 forecast evaluation (if present)
        run: |
          if [ -f scripts/v7_forecast_engine.py ]; then
            python scripts/v7_forecast_engine.py --data-dir data/industry_observations --output audit-output/v7_forecast_evaluation.json
          else
            echo "Engine not yet committed."
          fi
      - name: Reproduce committed evidence from the dated snapshot
        run: |
          python scripts/v7_forecast_engine.py --data-dir data/v7 --output audit-output/v7_snapshot_evaluation.json > /dev/null
          python - <<'PY'
          import json
          a = json.load(open("audit-output/v7_snapshot_evaluation.json"))
          b = json.load(open("docs/evidence/v7_forecast_evaluation_2026-11-17.json"))
          key = lambda r: {(e["target"], e["horizon_months"]): (e["publishable"], e["full_sample"]["model"]["bss_vs_base_rate"], e["full_sample"]["model"]["auc"]) for e in r["evaluations"]}
          assert key(a) == key(b), "Snapshot evaluation no longer reproduces committed evidence"
          print("Reproduced committed V7 evidence from data/v7 snapshot:", sum(v[0] for v in key(a).values()), "publishable of", len(key(a)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-forecast-research
          path: |
            data/industry_observations/
            data/v7_research_fresh/
            audit-output/
          retention-days: 30
