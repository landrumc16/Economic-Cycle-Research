name: Daily Economic Source Acquisition
on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_acquisition_status.py'
      - 'tests/test_daily_acquisition_status.py'
      - '.github/workflows/daily-economic-source-acquisition.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * *'
permissions:
  contents: read
concurrency:
  group: daily-source-acquisition
  cancel-in-progress: false
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test daily evidence failure gate
        run: python -m unittest discover -s tests -p 'test_daily_acquisition_status.py' -v
      - name: Acquire official FRED observations
        id: fred
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: timeout 300s python scripts/fred_api.py --output audit-output/fred-api
      - name: Acquire official BLS observations
        id: bls
        continue-on-error: true
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: timeout 300s python scripts/bls_api.py --output audit-output/bls-api
      - name: Acquire official BEA observations
        id: bea
        continue-on-error: true
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: timeout 180s python scripts/bea_api.py --output audit-output/bea-api
      - name: Summarize acquisition without promoting sources
        if: always()
        env:
          FRED_OUTCOME: ${{ steps.fred.outcome }}
          BLS_OUTCOME: ${{ steps.bls.outcome }}
          BEA_OUTCOME: ${{ steps.bea.outcome }}
        run: python scripts/daily_acquisition_status.py
      - name: Preserve dated source acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-economic-source-evidence
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14
