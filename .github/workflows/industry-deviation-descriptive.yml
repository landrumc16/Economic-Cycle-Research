name: Monthly Economic Cycle Assessment
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'data/workbook_evidence/**'
      - '.github/workflows/industry-deviation-descriptive.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 13 20 * *'
jobs:
  descriptive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_industry_deviation_*.py' -v && python -m unittest discover -s tests -p 'test_fetch_industry_observations.py' -v
      - name: Multifactor research tests
        run: python -m unittest discover -s tests -p 'test_industry_multifactor_research.py' -v
      - name: Credit growth transformation tests
        run: python -m unittest discover -s tests -p 'test_derive_credit_growth.py' -v
      - name: Housing fundamentals transformation tests
        run: python -m unittest discover -s tests -p 'test_derive_housing_income_divergence.py' -v
      - name: Equity valuation transformation tests
        run: python -m unittest discover -s tests -p 'test_derive_equity_valuation_gap.py' -v
      - name: Multifactor release gate regression tests
        run: python -m unittest discover -s tests -p 'test_validate_multifactor_release.py' -v
      - name: Monthly assessment regression tests
        run: python -m unittest discover -s tests -p 'test_build_weekly_economic_assessment.py' -v
      - name: Dashboard regression tests
        run: python -m unittest discover -s tests -p 'test_build_economic_dashboard.py' -v
      - name: Assessment history regression tests
        run: python -m unittest discover -s tests -p 'test_weekly_assessment_history.py' -v
      - name: Historical timeline regression tests
        run: python -m unittest discover -s tests -p 'test_build_historical_cycle_timeline.py' -v
      - name: Monthly release gate regression tests
        run: python -m unittest discover -s tests -p 'test_validate_weekly_release.py' -v
      - name: Historical comparison regression tests
        run: python -m unittest discover -s tests -p 'test_build_historical_condition_comparison.py' -v
      - name: V5 cycle estimator regression tests
        run: python -m unittest discover -s tests -p 'test_v5_cycle_estimator.py' -v
      - name: V5 historical evaluation regression tests
        run: python -m unittest discover -s tests -p 'test_v5_cycle_evaluation.py' -v
      - name: V5 forward-outcome regression tests
        run: python -m unittest discover -s tests -p 'test_v5_forward_outcomes.py' -v
      - name: V5 executive brief regression tests
        run: python -m unittest discover -s tests -p 'test_v5_executive_brief.py' -v
      - name: V5 episode diagnostic regression tests
        run: python -m unittest discover -s tests -p 'test_v5_episode_diagnostic.py' -v
      - name: V5 temporal baseline regression tests
        run: python -m unittest discover -s tests -p 'test_v5_baseline_validation.py' -v
      - name: V5 forecast release gate regression tests
        run: python -m unittest discover -s tests -p 'test_v5_forecast_release_gate.py' -v
      - name: V5 dashboard regression tests
        run: python -m unittest discover -s tests -p 'test_v5_dashboard.py' -v
      - name: Unified research status regression tests
        run: python -m unittest discover -s tests -p 'test_v5_unified_research_status.py' -v
      - name: Workbook evidence converter regression tests
        run: python -m unittest discover -s tests -p 'test_v5_workbook_evidence.py' -v
      - name: Real workbook snapshot integration regression
        run: python -m unittest discover -s tests -p 'test_v5_workbook_snapshot_integration.py' -v
      - name: Unified V5 portal regression tests
        run: python -m unittest discover -s tests -p 'test_v5_unified_portal.py' -v
      - name: V5 integrated acceptance regression tests
        run: python -m unittest discover -s tests -p 'test_v5_integrated_acceptance.py' -v
      - name: Registry audit
        run: python scripts/industry_deviation_registry_audit.py
      - name: Fetch retrospective observations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_industry_observations.py NASDAQCOM --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py CSUSHPINSA --start 1987-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py TOTALSL --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py BUSLOANS --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py PI --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py UNRATE --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py CPIAUCSL --start 1980-01-01 --end "$(date -u +%F)"
          python scripts/fetch_industry_observations.py INDPRO --start 1980-01-01 --end "$(date -u +%F)"
      - name: Derive historical credit growth
        run: |
          for series in TOTALSL BUSLOANS; do
            python scripts/derive_credit_growth.py "data/industry_observations/${series}_monthly.csv" --output "data/industry_observations/${series}_growth12m.csv"
          done
      - name: Derive housing price-income growth divergence
        run: python scripts/derive_housing_income_divergence.py data/industry_observations/CSUSHPINSA_monthly.csv data/industry_observations/PI_monthly.csv --output data/industry_observations/housing_income_divergence.csv
      - name: Calculate backward-looking descriptive deviations
        run: |
          python scripts/industry_deviation_metrics.py data/industry_observations/NASDAQCOM_monthly.csv --output audit-output/NASDAQCOM_deviation.json
          python scripts/industry_deviation_metrics.py data/industry_observations/CSUSHPINSA_monthly.csv --output audit-output/CSUSHPINSA_deviation.json
      - name: Compare high-deviation and other months
        run: |
          python scripts/industry_deviation_comparison.py data/industry_observations/NASDAQCOM_monthly.csv --output audit-output/NASDAQCOM_comparison.json
          python scripts/industry_deviation_comparison.py data/industry_observations/CSUSHPINSA_monthly.csv --output audit-output/CSUSHPINSA_comparison.json
          for series in NASDAQCOM CSUSHPINSA; do
            for horizon in 6 24; do
              python scripts/industry_deviation_comparison.py data/industry_observations/${series}_monthly.csv --horizon "$horizon" --output "audit-output/${series}_comparison_${horizon}m.json"
            done
          done
      - name: Housing-specific drawdown threshold sensitivity
        run: |
          for threshold in 0.05 0.10 0.15; do
            for horizon in 6 12 24; do
              python scripts/industry_deviation_comparison.py data/industry_observations/CSUSHPINSA_monthly.csv --threshold "$threshold" --horizon "$horizon" --output "audit-output/CSUSHPINSA_comparison_${horizon}m_threshold_${threshold}.json"
            done
          done
      - name: Analyze alert episodes and lead times
        run: |
          for series in NASDAQCOM CSUSHPINSA; do
            for horizon in 6 12 24; do
              python scripts/industry_deviation_episode_analysis.py "data/industry_observations/${series}_monthly.csv" --horizon "$horizon" --output "audit-output/${series}_episodes_${horizon}m.json"
            done
          done
      - name: Baseline for multifactor expansion
        run: |
          python scripts/industry_multifactor_research.py data/industry_observations/NASDAQCOM_monthly.csv --output audit-output/NASDAQCOM_multifactor_baseline.json
          python scripts/industry_multifactor_research.py data/industry_observations/CSUSHPINSA_monthly.csv --output audit-output/CSUSHPINSA_multifactor_baseline.json
          for series in NASDAQCOM CSUSHPINSA; do
            for horizon in 6 12 24; do
              python scripts/industry_multifactor_research.py "data/industry_observations/${series}_monthly.csv" --horizon "$horizon" --indicator "consumer_credit_growth=data/industry_observations/TOTALSL_growth12m.csv" --indicator "business_credit_growth=data/industry_observations/BUSLOANS_growth12m.csv" --output "audit-output/${series}_credit_joint_${horizon}m.json"
            done
          done
          for horizon in 6 12 24; do
            python scripts/industry_multifactor_research.py data/industry_observations/CSUSHPINSA_monthly.csv --horizon "$horizon" --threshold 0.10 --indicator "housing_income_divergence=data/industry_observations/housing_income_divergence.csv" --indicator "consumer_credit_growth=data/industry_observations/TOTALSL_growth12m.csv" --indicator "business_credit_growth=data/industry_observations/BUSLOANS_growth12m.csv" --output "audit-output/CSUSHPINSA_fundamentals_credit_${horizon}m.json"
          done
      - name: Generate consolidated historical report
        run: python scripts/industry_deviation_summary.py
      - name: Generate integrated credit and acceleration evidence
        run: python scripts/industry_credit_research_summary.py
      - name: Multifactor descriptive release gate
        run: python scripts/validate_multifactor_release.py
      - name: Build historical economic condition timeline
        run: python scripts/build_historical_cycle_timeline.py
      - name: Build V5 retrospective cycle estimates
        run: python scripts/v5_cycle_estimator.py audit-output/historical_cycle_timeline.json
      - name: Evaluate V5 historical cycle estimates
        run: python scripts/v5_cycle_evaluation.py audit-output/v5_cycle_estimates.json
      - name: Evaluate V5 historical forward outcomes
        run: python scripts/v5_forward_outcomes.py audit-output/v5_cycle_estimates.json
      - name: Generate V5 monthly research brief
        run: python scripts/v5_executive_brief.py audit-output/v5_cycle_estimates.json audit-output/v5_forward_outcomes.json
      - name: Evaluate V5 recession episodes and warning lead times
        run: python scripts/v5_episode_diagnostic.py audit-output/v5_cycle_estimates.json
      - name: Validate V5 horizons against historical baseline
        run: python scripts/v5_baseline_validation.py audit-output/v5_cycle_estimates.json
      - name: Gate V5 numeric forecast release
        run: python scripts/v5_forecast_release_gate.py audit-output/v5_baseline_validation.json
      - name: Build V5 historical research dashboard
        run: python scripts/v5_dashboard.py audit-output/v5_cycle_estimates.json audit-output/v5_cycle_evaluation.json audit-output/v5_baseline_validation.json audit-output/v5_forecast_release_gate.json audit-output/v5_episode_diagnostic.json
      - name: Publish monthly integrated economic assessment
        run: python scripts/build_weekly_economic_assessment.py --as-of "$(date -u +%F)"
      - name: Compare current conditions with historical months
        run: python scripts/build_historical_condition_comparison.py audit-output/historical_cycle_timeline.json audit-output/weekly_economic_assessment.json
      - name: Restore previous assessment archive
        uses: actions/cache/restore@v4
        with:
          path: audit-output/weekly_assessment_history.json
          key: economic-weekly-history-${{ github.run_id }}
          restore-keys: |
            economic-weekly-history-
      - name: Prepare prior assessment and update history
        run: python scripts/weekly_assessment_history.py audit-output/weekly_economic_assessment.json
      - name: Generate monthly dashboard
        run: |
          if [ -f audit-output/previous_weekly_assessment.json ]; then
            python scripts/build_economic_dashboard.py audit-output/weekly_economic_assessment.json --previous audit-output/previous_weekly_assessment.json --historical audit-output/historical_condition_comparison.json
          else
            python scripts/build_economic_dashboard.py audit-output/weekly_economic_assessment.json --historical audit-output/historical_condition_comparison.json
          fi
      - name: Monthly integrated release acceptance gate
        run: python scripts/validate_weekly_release.py
      - name: Convert dated workbook promotion evidence
        run: python scripts/v5_workbook_evidence.py data/workbook_evidence/promotion_gate_2026-11-01.json
      - name: Build fail-closed unified research status
        run: python scripts/v5_unified_research_status.py audit-output/weekly_release_acceptance.json audit-output/v5_forecast_release_gate.json --workbook-evidence audit-output/v5_workbook_evidence.json
      - name: Build V5 unified research landing page
        run: python scripts/v5_unified_portal.py
      - name: Validate complete V5 integrated release artifacts
        run: python scripts/v5_integrated_acceptance.py
      - name: V6 sector and public-site regression tests
        run: python -m unittest discover -s tests -p 'test_v6_*.py' -v
      - name: Publish unified V5 release summary
        if: always()
        shell: bash
        run: |
          echo "## Version 5 Unified Research" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          folder = Path("audit-output")
          status_file = folder / "unified_research_status.json"
          acceptance_file = folder / "v5_integrated_acceptance.json"
          lines = []
          if status_file.is_file():
              d = json.loads(status_file.read_text())
              lines.extend([
                  f"**Monthly gate:** {d['github_monthly_release_status']}",
                  f"**Workbook reconciliation:** {d['workbook_reconciliation']}",
                  f"**Snapshot date:** {d.get('workbook_snapshot_retrieval_date') or 'Unavailable'}",
                  "**Numeric forecasts:** BLOCKED",
              ])
          else:
              lines.append("**Unified research status:** NOT VERIFIED")
          if acceptance_file.is_file():
              a = json.loads(acceptance_file.read_text())
              lines.append(f"**Integrated artifact gate:** {a['status']}")
          else:
              lines.append("**Integrated artifact gate:** NOT VERIFIED")
          lines.extend(["", "Download the workflow artifact to inspect index.html and research reports."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          PY
      - name: Descriptive release acceptance gate
        run: python scripts/validate_industry_deviation_release.py
      - name: Verify V6 publication and sector evidence gates
        run: python -m unittest discover -s tests -p 'test_v6_*.py' -v
      - name: Build V6 evidence-gated public research pages
        run: python scripts/v6_public_site.py --as-of "$(date -u +%F)"
      - name: Persist assessment history
        uses: actions/cache/save@v4
        with:
          path: audit-output/weekly_assessment_history.json
          key: economic-weekly-history-${{ github.run_id }}
      - name: Publish release result in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Economic Cycle Research — Version 4 Monthly Review"
            echo
            if [ -f audit-output/weekly_release_acceptance.json ]; then
              echo "**Monthly release gate:** $(python -c 'import json; print(json.load(open("audit-output/weekly_release_acceptance.json"))["status"])')"
              echo
              echo '~~~json'
              cat audit-output/weekly_release_acceptance.json
              echo '~~~'
            else
              echo "**Monthly release gate:** NOT PASSED — inspect preceding steps."
            fi
            if [ -f audit-output/historical_condition_comparison.md ]; then
              echo
              echo "### Historical comparison"
              head -n 16 audit-output/historical_condition_comparison.md
            fi
            echo
            echo "Retrospective research only. Current-vintage data are not point-in-time."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: industry-deviation-descriptive-evidence
          if-no-files-found: warn
          path: |
            audit-output/
            data/industry_observations/
          retention-days: 30
